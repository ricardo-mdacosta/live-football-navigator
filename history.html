<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Data - Select a Country</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ffffff;
        }
        #countries-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 20px auto;
        }
        .country-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .country-card:hover {
            transform: translateY(-5px);
            background-color: #2a2a2a;
        }
        .country-card img {
            width: 50px;
            height: auto;
            margin-bottom: 10px;
        }
        #loading {
            text-align: center;
            font-size: 1.2em;
            padding: 40px;
        }
    </style>
</head>
<body>

    <h1>Select a Country</h1>
    <div id="countries-container">
        <div id="loading">Loading countries...</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const countriesContainer = document.getElementById('countries-container');
            const loadingDiv = document.getElementById('loading');

            // Fetch the list of countries from our backend
            fetch("http://127.0.0.1:8000/countries")
                .then(response => response.json())
                .then(countries => {
                    loadingDiv.style.display = 'none'; // Hide the loading message

                    if (countries.error) {
                        countriesContainer.innerHTML = `<p style="color: #ff4d4d;">Error: ${countries.error}</p>`;
                        return;
                    }
                    
                    // Loop through each country and create a card for it
                    countries.forEach(country => {
                        const card = document.createElement('div');
                        card.className = 'country-card';
                        
                        card.innerHTML = `
                            <img src="${country.country_logo}" alt="${country.country_name}">
                            <div>${country.country_name}</div>
                        `;

                        // Add a click listener to navigate to the leagues page
                        card.addEventListener('click', () => {
                            // This redirects the browser to leagues.html, passing the selected country's
                            // ID and name in the URL for the next page to use.
                            window.location.href = `leagues.html?country_id=${country.country_id}&country_name=${encodeURIComponent(country.country_name)}`;
                        });

                        countriesContainer.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error('Failed to fetch countries:', error);
                    loadingDiv.textContent = 'Failed to load countries. Check the backend server and your internet connection.';
                    loadingDiv.style.color = '#ff4d4d';
                });
        });
    </script>

</body>
</html>
