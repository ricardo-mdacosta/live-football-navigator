<!-- index.html (version 16 - Definitive, Modal Status Fixed) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Football Navigator</title>
    <style>
        /* --- Brutalist Base Styles --- */
        body { font-family: 'Courier New', Courier, monospace; background-color: #f0f0f0; color: #000; margin: 0; padding: 20px; }
        h1 { text-align: center; font-weight: bold; font-size: 2em; margin-bottom: 0; }
        #status { text-align: center; margin-bottom: 40px; font-weight: bold; }
        #status.connected { color: #00ff00; }
        #status.disconnected { color: #ff0000; }

        /* --- Condensed List Styles --- */
        #matches-container { max-width: 1200px; margin: 20px auto; border: 2px solid #000; }
        .match-row { display: flex; align-items: center; padding: 12px 15px; background-color: #f0f0f0; border-bottom: 2px solid #000; cursor: pointer; transition: background-color 0.1s linear; }
        .match-row:last-child { border-bottom: none; }
        .match-row:hover { background-color: #ffff00; }
        .match-row.goal-flash { background-color: #00ff00; }
        .match-row.finished { opacity: 0.6; }
        .match-status { width: 60px; font-weight: bold; font-size: 1em; text-align: center; }
        .team-info { display: flex; align-items: center; justify-content: flex-end; flex: 1; gap: 10px; }
        .team-info.away { justify-content: flex-start; }
        .team-name { font-weight: bold; font-size: 1.1em; }
        .team-logo { width: 25px; height: 25px; }
        .red-cards { color: #ff0000; font-weight: bold; width: 30px; text-align: center; }
        .match-score { font-size: 1.6em; font-weight: bold; margin: 0 20px; }
        .match-context { width: 250px; text-align: right; font-size: 0.8em; }

        /* --- Definitive Modal Styles --- */
        #modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        #modal-content { background-color: #f0f0f0; color: #000; margin: 5% auto; border: 2px solid #000; width: 90%; max-width: 800px; }
        #modal-close { color: #000; position: absolute; top: 10px; right: 25px; font-size: 28px; font-weight: bold; cursor: pointer; z-index: 10; }
        .modal-header { background-color: #f0f0f0; border-bottom: 2px solid #000; padding: 20px; text-align: center; }
        .modal-header h3 { margin: 0 0 10px 0; }
        .modal-sub-header { font-size: 0.8em; color: #555; }
        .modal-tabs { display: flex; border-bottom: 2px solid #000; }
        .tab-link { padding: 15px 20px; cursor: pointer; flex-grow: 1; text-align: center; background: #f0f0f0; }
        .tab-link:hover { background-color: #ffff00; }
        .tab-link.active { background-color: #000; color: #f0f0f0; }
        .tab-content { display: none; padding: 20px; max-height: 50vh; overflow-y: auto; }
        .modal-scoreboard { display: flex; justify-content: space-around; align-items: center; padding: 20px; }
        .modal-team { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 40%; }
        .modal-team img { width: 60px; height: 60px; border: 2px solid #000; }
        .modal-team-name { font-size: 1.2em; font-weight: bold; text-align: center; }
        .modal-score-details { text-align: center; }
        .modal-score { font-size: 2.5em; font-weight: bold; }
        .modal-minute { font-size: 1.2em; color: #555; } /* ADDED THIS LINE */
        .timeline { list-style: none; padding: 0; }
        .timeline-event { display: flex; align-items: center; gap: 15px; padding: 8px 0; border-bottom: 1px solid #ccc; }
        .event-icon { font-size: 1.2em; width: 25px; text-align: center; }
        .event-minute { font-weight: bold; }
        .event-assist { font-size: 0.8em; color: #555; }
        .lineups-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .lineup-list { list-style: none; padding: 0; }
        .lineup-list h4, .lineup-list h5 { margin-top: 0; margin-bottom: 10px; }
        .lineup-list h5 { margin-top: 15px; color: #555; }
        .lineup-list li { padding: 4px 0; font-size: 0.9em; }
        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; }
    </style>
</head>
<body>
    <h1>LIVE NAVIGATOR</h1>
    <div id="status">CONNECTING...</div>
    <div id="matches-container"></div>

    <div id="modal">
        <div id="modal-content">
            <span id="modal-close">&times;</span>
            <div id="modal-header-container" class="modal-header"></div>
            <div id="modal-scoreboard-container" class="modal-scoreboard"></div>
            <div class="modal-tabs">
                <div class="tab-link active" onclick="openTab(event, 'events')">EVENTS</div>
                <div class="tab-link" onclick="openTab(event, 'stats')">STATS</div>
                <div class="tab-link" onclick="openTab(event, 'lineups')">LINEUPS</div>
            </div>
            <div id="events" class="tab-content" style="display: block;"></div>
            <div id="stats" class="tab-content"></div>
            <div id="lineups" class="tab-content"></div>
        </div>
    </div>

    <script>
        function openTab(evt, tabName) { /* ... same as previous version ... */ }
        openTab = function(evt, tabName) { const tc = document.getElementsByClassName("tab-content"); for (let i = 0; i < tc.length; i++) tc[i].style.display = "none"; const tl = document.getElementsByClassName("tab-link"); for (let i = 0; i < tl.length; i++) tl[i].className = tl[i].className.replace(" active", ""); document.getElementById(tabName).style.display = "block"; evt.currentTarget.className += " active"; };

        document.addEventListener("DOMContentLoaded", function() {
            const statusDiv = document.getElementById('status');
            const matchesContainer = document.getElementById('matches-container');
            const modal = document.getElementById('modal');
            const modalClose = document.getElementById('modal-close');
            const liveMatchesData = {};

            const socket = new WebSocket("ws://127.0.0.1:8000/ws");

            // --- WebSocket handling logic (unchanged) ---
            socket.onopen = () => { statusDiv.textContent = "CONNECTED"; statusDiv.className = 'connected'; };
            socket.onclose = () => { statusDiv.textContent = "DISCONNECTED"; statusDiv.className = 'disconnected'; };
            socket.onerror = () => { statusDiv.textContent = "CONNECTION ERROR"; statusDiv.className = 'disconnected'; };
            socket.onmessage = function(event) {
                const receivedData = JSON.parse(event.data);
                const matchesToProcess = Array.isArray(receivedData) ? receivedData : [receivedData];
                const initialMatchCount = Object.keys(liveMatchesData).length;
                let goalMatchIds = new Set();
                let finishedMatchToggled = false;
                for (const match of matchesToProcess) {
                    if (match.match_id) {
                        const wasFinished = liveMatchesData[match.match_id]?.match_status === 'Finished';
                        const isFinished = match.match_status === 'Finished';
                        if (wasFinished !== isFinished) finishedMatchToggled = true;
                        if (match.action === 'goal') goalMatchIds.add(match.match_id);
                        liveMatchesData[match.match_id] = match;
                    }
                }
                if (initialMatchCount !== Object.keys(liveMatchesData).length || finishedMatchToggled) {
                    renderFullList();
                } else {
                    for (const match of matchesToProcess) updateMatchRow(match);
                }
                goalMatchIds.forEach(id => flashGoal(id));
            };

            function countRedCards(cards, teamType) { if (!cards) return 0; return cards.filter(card => card.card === 'red card' && card[teamType]).length; }
            function updateMatchRow(match) { const row = matchesContainer.querySelector(`[data-match-id='${match.match_id}']`); if (!row) return; const status = match.match_status === 'Finished' ? 'FT' : (parseInt(match.match_status) > 0 ? `${match.match_status}'` : match.match_time); row.querySelector('.match-status').textContent = status; row.querySelector('.match-score').textContent = `${match.match_hometeam_score} - ${match.match_awayteam_score}`; row.querySelector('.home-red-cards').textContent = `🔴 ${countRedCards(match.cards, 'home_fault')}`; row.querySelector('.away-red-cards').textContent = `🔴 ${countRedCards(match.cards, 'away_fault')}`; }
            function renderFullList() {
                matchesContainer.innerHTML = '';
                const sortedMatches = Object.values(liveMatchesData).sort((a, b) => { const aIsFinished = a.match_status === 'Finished'; const bIsFinished = b.match_status === 'Finished'; if (aIsFinished && !bIsFinished) return 1; if (!aIsFinished && bIsFinished) return -1; return a.match_time.localeCompare(b.match_time); });
                if (sortedMatches.length === 0) { matchesContainer.innerHTML = '<div style="padding: 20px; text-align: center;">NO LIVE MATCHES CURRENTLY.</div>'; return; }
                for (const match of sortedMatches) {
                    const row = document.createElement('div');
                    const isFinished = match.match_status === 'Finished';
                    row.className = `match-row ${isFinished ? 'finished' : ''}`;
                    row.dataset.matchId = match.match_id;
                    const status = isFinished ? 'FT' : (parseInt(match.match_status) > 0 ? `${match.match_status}'` : match.match_time);
                    const homeReds = countRedCards(match.cards, 'home_fault');
                    const awayReds = countRedCards(match.cards, 'away_fault');
                    row.innerHTML = `<div class="match-status">${status}</div><div class="team-info"><span class="team-name">${match.match_hometeam_name.toUpperCase()}</span><img class="team-logo" src="${match.team_home_badge}" alt=""><span class="red-cards home-red-cards">🔴 ${homeReds}</span></div><div class="match-score">${match.match_hometeam_score} - ${match.match_awayteam_score}</div><div class="team-info away"><span class="red-cards away-red-cards">🔴 ${awayReds}</span><img class="team-logo" src="${match.team_away_badge}" alt=""><span class="team-name">${match.match_awayteam_name.toUpperCase()}</span></div><div class="match-context"><span>${match.country_name} / ${match.league_name}</span></div>`;
                    row.addEventListener('click', () => showDetails(match.match_id));
                    matchesContainer.appendChild(row);
                }
            }
            function flashGoal(matchId) { const row = matchesContainer.querySelector(`[data-match-id='${matchId}']`); if (row) { row.classList.add('goal-flash'); setTimeout(() => { row.classList.remove('goal-flash'); }, 1000); } }

            // --- DEFINITIVE showDetails function with Modal Status FIX ---
            function showDetails(matchId) {
                const matchData = liveMatchesData[matchId];
                if (!matchData) return;
                
                // 1. Populate Header & Scoreboard
                const status = matchData.match_status === 'Finished' ? 'FT' : `${matchData.match_status}'`;
                document.getElementById('modal-header-container').innerHTML = `<h3>${matchData.country_name} - ${matchData.league_name}</h3><div class="modal-sub-header">Stadium: ${matchData.match_stadium || 'N/A'} | Referee: ${matchData.match_referee || 'N/A'}</div>`;
                // THIS IS THE FIX: Added the 'modal-minute' div with the status.
                document.getElementById('modal-scoreboard-container').innerHTML = `<div class="modal-team"><img src="${matchData.team_home_badge}" alt=""><div class="modal-team-name">${matchData.match_hometeam_name}</div></div> <div class="modal-score-details"><div class="modal-score">${matchData.match_hometeam_score} - ${matchData.match_awayteam_score}</div><div class="modal-minute">${status}</div></div> <div class="modal-team"><img src="${matchData.team_away_badge}" alt=""><div class="modal-team-name">${matchData.match_awayteam_name}</div></div>`;
                
                // 2. Build Events Timeline
                const timelineContainer = document.getElementById('events');
                timelineContainer.innerHTML = '';
                const events = [];
                (matchData.goalscorer || []).forEach(g => events.push({ time: parseInt(g.time), type: 'goal', data: g }));
                (matchData.cards || []).forEach(c => events.push({ time: parseInt(c.time), type: 'card', data: c }));
                (matchData.substitutions?.home || []).forEach(s => events.push({ time: parseInt(s.time), type: 'sub', team: 'home', data: s }));
                (matchData.substitutions?.away || []).forEach(s => events.push({ time: parseInt(s.time), type: 'sub', team: 'away', data: s }));
                events.sort((a, b) => a.time - b.time);

                if (events.length > 0) {
                    let eventsHtml = '<ul class="timeline">';
                    events.forEach(event => {
                         if (event.type === 'goal') {
                            const scorer = event.data.home_scorer || event.data.away_scorer;
                            let assistText = '';
                            if(event.data.home_assist || event.data.away_assist) assistText = `<div class="event-assist">Assist by ${event.data.home_assist || event.data.away_assist}</div>`;
                            eventsHtml += `<li class="timeline-event"><div class="event-icon">⚽️</div><div class="event-minute">${event.data.time}'</div><div>Goal for ${scorer}${assistText}</div></li>`;
                        } else if (event.type === 'card') {
                            const player = event.data.home_fault || event.data.away_fault;
                            const icon = event.data.card === 'yellow card' ? '🟨' : '🟥';
                            eventsHtml += `<li class="timeline-event"><div class="event-icon">${icon}</div><div class="event-minute">${event.data.time}'</div><div>Card for ${player}</div></li>`;
                        } else if (event.type === 'sub') {
                            eventsHtml += `<li class="timeline-event"><div class="event-icon">🔄</div><div class="event-minute">${event.data.time}'</div><div>Sub for ${event.team === 'home' ? matchData.match_hometeam_name : matchData.match_awayteam_name}: ${event.data.substitution.replace(' | ', '  SUBSTITUTES ')}</div></li>`;
                        }
                    });
                    timelineContainer.innerHTML = eventsHtml + '</ul>';
                } else {
                    timelineContainer.innerHTML = '<p>No events to show.</p>';
                }

                // 3. Build Statistics
                const statsContainer = document.getElementById('stats');
                statsContainer.innerHTML = '';
                if (matchData.statistics && matchData.statistics.length > 0) {
                    let statsHtml = '';
                    const uniqueStats = new Map();
                    matchData.statistics.forEach(stat => uniqueStats.set(stat.type, stat));
                    uniqueStats.forEach(stat => {
                        statsHtml += `<div class="stat-row"><span>${stat.home}</span><strong>${stat.type}</strong><span>${stat.away}</span></div>`;
                    });
                    statsContainer.innerHTML = statsHtml;
                } else {
                    statsContainer.innerHTML = '<p>Statistics not available.</p>';
                }

                // 4. Build Lineups
                const lineupsContainer = document.getElementById('lineups');
                lineupsContainer.innerHTML = '';
                if (matchData.lineup) {
                    const homeCoach = matchData.lineup.home.coach?.[0]?.lineup_player || 'N/A';
                    const awayCoach = matchData.lineup.away.coach?.[0]?.lineup_player || 'N/A';
                    const homeStarters = (matchData.lineup.home.starting_lineups || []).map(p => `<li>${p.lineup_number}. ${p.lineup_player}</li>`).join('');
                    const awayStarters = (matchData.lineup.away.starting_lineups || []).map(p => `<li>${p.lineup_number}. ${p.lineup_player}</li>`).join('');
                    const homeSubs = (matchData.lineup.home.substitutes || []).map(p => `<li>${p.lineup_number}. ${p.lineup_player}</li>`).join('');
                    const awaySubs = (matchData.lineup.away.substitutes || []).map(p => `<li>${p.lineup_number}. ${p.lineup_player}</li>`).join('');

                    lineupsContainer.innerHTML = `
                        <div class="lineups-grid">
                            <div>
                                <ul class="lineup-list">
                                    <h4>${matchData.match_hometeam_name} (${matchData.match_hometeam_system || 'N/A'})</h4>
                                    <h5>Coach: ${homeCoach}</h5>
                                    ${homeStarters}
                                    <h5>Substitutes</h5>
                                    ${homeSubs}
                                </ul>
                            </div>
                            <div>
                                <ul class="lineup-list">
                                    <h4>${matchData.match_awayteam_name} (${matchData.match_awayteam_system || 'N/A'})</h4>
                                    <h5>Coach: ${awayCoach}</h5>
                                    ${awayStarters}
                                    <h5>Substitutes</h5>
                                    ${awaySubs}
                                </ul>
                            </div>
                        </div>`;
                } else {
                    lineupsContainer.innerHTML = '<p>Lineups not available.</p>';
                }

                openTab({currentTarget: document.querySelector('.tab-link')}, 'events');
                modal.style.display = 'block';
            }

            modalClose.onclick = () => { modal.style.display = 'none'; };
            window.onclick = (event) => { if (event.target == modal) modal.style.display = 'none'; };
        });
    </script>
</body>
</html>
